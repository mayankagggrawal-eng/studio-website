<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events | New Pratibha Digital Studio</title>
<link rel="canonical" href="https://studio-website-d42.pages.dev/en/events.html">
  <link rel="alternate" hreflang="en" href="https://studio-website-d42.pages.dev/en/events.html">
  <link rel="alternate" hreflang="hi" href="https://studio-website-d42.pages.dev/hi/events.html">
  <link rel="alternate" hreflang="mr" href="https://studio-website-d42.pages.dev/mr/events.html">
  <link rel="alternate" hreflang="x-default" href="https://studio-website-d42.pages.dev/en/events.html">

  <link rel="stylesheet" href="../../css/style.css">
</head>

<body>

<div class="events-top">
  <section class="event-hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <span class="hero-tag">Luxury Event Shoot</span>
      <h1>
        Every Event
        <span>Deserves a Timeless Story</span>
      </h1>
      <p>
        Capturing emotions, traditions, and unforgettable memories with cinematic elegance.
      </p>
      <a href="#gallery" class="hero-btn">Explore Gallery</a>
    </div>
    <div class="scroll-indicator">Scroll</div>
  </section>

  <section class="gallery-categories" id="gallery">
    <h2 class="section-title">Events Gallery</h2>
    <div class="category-grid">
      
      <button class="category-btn" data-filter="Maternity Shoot">🤰🏻 Maternity Shoot</button>
    </div>
  </section>
</div>


<section class="Events-gallery">
  <div class="gallery-grid"></div>
</section>

<!-- Gallery Lightbox -->
<div id="gallery-lightbox" class="gallery-lightbox"></div>

<!-- Premium Music Player -->
<button id="musicToggle"
        class="music-toggle"
        type="button"
        aria-label="Play background music"
        aria-pressed="false">
    <span class="music-icon">♫</span>
    <span class="music-label">Music Off</span>
</button>


<script src="../../js/eventsData.js"></script>
<script src="../../js/gallery.js"></script>
<script src="../../js/main.js"></script>
<script src="../../js/music-player.js" defer></script>
<script src="../../js/navigation.js" defer></script>


</body>
